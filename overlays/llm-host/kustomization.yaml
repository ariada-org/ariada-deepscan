# Real model on the host machine: Ollama running next to the cluster, reached through a
# Service named "ollama" that has no pods behind it, only the host's address. Fastest on a
# laptop, because the host's Ollama can use the GPU (Metal on a Mac) and containers cannot.
#   LLM=host ./scripts/kind-up.sh
# scripts/deploy.sh finds the host address and writes host-endpoint.yaml from host-endpoint.yaml.in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deepscan
resources:
  - ../../k8s
  - host-endpoint.yaml
patches:
  - target: { kind: ConfigMap, name: deepscan-config }
    patch: |-
      - op: replace
        path: /data/LLM_PROVIDER
        value: openai
      # the full name: Ollama answers 403 to a Host header it does not know (its DNS-rebinding
      # guard), and lets names ending in .local through
      - op: replace
        path: /data/OPENAI_BASE_URL
        value: http://ollama.deepscan.svc.cluster.local:11434/v1
      # one model serves every agent pod: one request per pod keeps the queue shorter than the lease
      - op: replace
        path: /data/WORKER_CONCURRENCY
        value: "1"
