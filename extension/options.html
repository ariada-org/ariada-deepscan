<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ariada DeepScan overlay – settings</title></head>
<body style="font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:2rem">
  <h1>Ariada DeepScan overlay</h1>
  <form id="f">
    <label for="api">DeepScan URL</label><br>
    <input id="api" type="url" required style="width:100%;font:inherit;padding:.4rem"><br><br>
    <button type="submit">Save</button> <span id="msg" role="status"></span>
  </form>
  <p>The repository must have its website URL set (the GitHub repository "homepage" field) so the overlay knows which scan belongs to the site.</p>
  <script src="options.js"></script>
</body>
</html>
