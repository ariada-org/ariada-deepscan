<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1257 882" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
<title id="t">Ariada DeepScan architecture</title>
<desc id="d">Browser and GitHub reach the cluster through one Ingress, which routes to the dashboard, findings-api and github-connector. github-connector writes scan jobs to PostgreSQL and calls the verifier as a policy gate. analysis-agent replicas claim jobs from PostgreSQL, call the LLM endpoint, read files through github-connector, search WCAG in rag-service and verify findings in the verifier, then write findings back. findings-api reads PostgreSQL for the UI. Dashed, outside the cluster and not connected yet: three Ariada products that take DeepScan's findings further. clamper.ai receives the findings and the baseline and gates the merge, blamer.ai takes a failed check and finds the commit and author, and reverter.ai opens a fix pull request on GitHub whose own scan reports the findings as resolved. Also dashed: one plugin core with adapters for the browser, code editors and CMS platforms, working both from the code to the page and from the page to the code, and exports of the findings in standard report formats (SARIF, JUnit XML, EARL, an ACR in the VPAT format, an accessibility statement).</desc>
