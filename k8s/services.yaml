# GitHub App: webhooks, App auth, repository ingest, publishing results, sign-in
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-connector
  labels:
    app.kubernetes.io/name: github-connector
    app.kubernetes.io/part-of: deepscan
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: github-connector
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-connector
        app.kubernetes.io/part-of: deepscan
        deepscan.io/db-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: github-connector
          image: deepscan-github-connector
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          envFrom:
            - configMapRef:
                name: deepscan-config
            - secretRef:
                name: deepscan-db
            - secretRef:
                name: deepscan-github
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "500m", memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: github-connector
  labels:
    app.kubernetes.io/name: github-connector
    app.kubernetes.io/part-of: deepscan
spec:
  selector:
    app.kubernetes.io/name: github-connector
  ports:
    - name: http
      port: 8080
      targetPort: http
---
