apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analysis-agent
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: analysis-agent }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
# Each microservice scales independently (requires metrics-server).
# analysis-agent is mostly I/O bound (LLM latency): queue-length scaling with KEDA is the documented next step.
---
